<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>VC Cup Admin Panel</title>
<style>body{font-family:Arial;background:#0b1020;color:#e5e7eb;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:16px;margin:14px 0}input,select,button,textarea{background:#0f172a;color:#e5e7eb;border:1px solid #334155;border-radius:8px;padding:8px}button{cursor:pointer;background:#166534;font-weight:700}.danger{background:#991b1b}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{width:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{font-size:12px;color:#94a3b8}</style></head><body>
<div class='wrap'>
<h1>🏆 VC Cup T20 Admin (/admin)</h1>
<div id='login' class='card'><h3>Match Referee Login</h3><p class='muted'>Default password: <b>matchreferee</b></p><input id='pass' type='password' placeholder='Password'><button onclick='login()' style='margin-left:8px'>Login</button><div id='err' style='color:#f87171'></div></div>
<div id='app' style='display:none'>
<div class='card'><div class='tabs'>
<button onclick="setTab('matches')">Match Results</button><button onclick="setTab('points')">Points Table</button><button onclick="setTab('stats')">Tournament Statistics</button><button onclick="setTab('mom')">Man of the Match</button><button onclick='saveAll()'>Save All</button><button class='danger' onclick='logout()'>Logout</button>
</div><p class='muted' id='status'>Ready.</p></div>
<div id='panel'></div></div></div>
<script>
const API='http://localhost:8787/api'; const AUTH='vccup_admin_auth_v1'; const PASS='vccup_admin_pass_v1'; const DEF='matchreferee'; const STORE='vccup_admin_data_v1';
let tab='matches'; let data={matches:[],points:[],stats:{runs:[],wickets:[]},mom:[]};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function auth(){return localStorage.getItem(AUTH)==='ok'}
function login(){const p=pass.value; if(p===(localStorage.getItem(PASS)||DEF)){localStorage.setItem(AUTH,'ok'); boot();} else err.textContent='Invalid password';}
function logout(){localStorage.removeItem(AUTH); location.reload();}
function setStatus(t){status.textContent=t}
async function load(){try{const r=await fetch(`${API}/tournament`); if(r.ok){data=(await r.json()).data; localStorage.setItem(STORE,JSON.stringify(data)); return;}}catch(e){}
const raw=localStorage.getItem(STORE); if(raw) data=JSON.parse(raw);
}
async function saveAll(){localStorage.setItem(STORE,JSON.stringify(data)); try{const r=await fetch(`${API}/tournament`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})}); setStatus(r.ok?'Saved to backend and local backup.':'Saved locally only.');}catch(e){setStatus('Saved locally only (API offline).')}}
function update(obj,key,val){obj[key]=val}
function render(){
if(tab==='matches') panel.innerHTML=`<div class='card'><h3>Update Match Results</h3>${data.matches.map((m,i)=>`<div class='card'><b>Match #${m.id||i+1}: ${esc(m.home)} vs ${esc(m.away)}</b><div class='grid'><label>Status<select onchange="update(data.matches[${i}],'status',this.value)"><option ${m.status==='upcoming'?'selected':''}>upcoming</option><option ${m.status==='live'?'selected':''}>live</option><option ${m.status==='completed'?'selected':''}>completed</option></select></label><label>Winner<input value='${esc(m.winner)}' oninput="update(data.matches[${i}],'winner',this.value)"></label><label>Home Score<input value='${esc(m.homeScore)}' oninput="update(data.matches[${i}],'homeScore',this.value)"></label><label>Away Score<input value='${esc(m.awayScore)}' oninput="update(data.matches[${i}],'awayScore',this.value)"></label><label>Result Summary<input value='${esc(m.resultSummary)}' oninput="update(data.matches[${i}],'resultSummary',this.value)"></label></div></div>`).join('')}</div>`;
if(tab==='points') panel.innerHTML=`<div class='card'><h3>Update Points Table</h3>${data.points.map((p,i)=>`<div class='row'><input value='${esc(p.team)}' oninput="update(data.points[${i}],'team',this.value)"><input value='${esc(p.pts)}' oninput="update(data.points[${i}],'pts',Number(this.value)||0)"><input value='${esc(p.M)}' oninput="update(data.points[${i}],'M',Number(this.value)||0)"><input value='${esc(p.W)}' oninput="update(data.points[${i}],'W',Number(this.value)||0)"><input value='${esc(p.L)}' oninput="update(data.points[${i}],'L',Number(this.value)||0)"><input value='${esc(p.nrr)}' oninput="update(data.points[${i}],'nrr',this.value)"></div>`).join('')}</div>`;
if(tab==='stats') panel.innerHTML=`<div class='card'><h3>Update Tournament Statistics (Most Runs / Most Wickets)</h3><h4>Runs</h4>${data.stats.runs.map((r,i)=>`<div class='row'><input value='${esc(r.name)}' oninput="update(data.stats.runs[${i}],'name',this.value)"><input value='${esc(r.team)}' oninput="update(data.stats.runs[${i}],'team',this.value)"><input value='${esc(r.runs)}' oninput="update(data.stats.runs[${i}],'runs',Number(this.value)||0)"><input value='${esc(r.balls)}' oninput="update(data.stats.runs[${i}],'balls',Number(this.value)||0)"></div>`).join('')}<h4>Wickets</h4>${data.stats.wickets.map((w,i)=>`<div class='row'><input value='${esc(w.name)}' oninput="update(data.stats.wickets[${i}],'name',this.value)"><input value='${esc(w.team)}' oninput="update(data.stats.wickets[${i}],'team',this.value)"><input value='${esc(w.wickets)}' oninput="update(data.stats.wickets[${i}],'wickets',Number(this.value)||0)"><input value='${esc(w.economy)}' oninput="update(data.stats.wickets[${i}],'economy',this.value)"></div>`).join('')}</div>`;
if(tab==='mom') panel.innerHTML=`<div class='card'><h3>Update Man of the Match</h3>${data.mom.map((m,i)=>`<div class='row'><input value='${esc(m.matchId)}' oninput="update(data.mom[${i}],'matchId',Number(this.value)||0)"><input value='${esc(m.playerName)}' placeholder='Player Name' oninput="update(data.mom[${i}],'playerName',this.value)"><input value='${esc(m.playerTeam)}' placeholder='Team' oninput="update(data.mom[${i}],'playerTeam',this.value)"><input value='${esc(m.performance)}' placeholder='Performance' oninput="update(data.mom[${i}],'performance',this.value)"></div>`).join('')}</div>`;
}
function setTab(t){tab=t;render()}
async function boot(){if(!auth()){login.style.display='block';app.style.display='none';return;}login.style.display='none';app.style.display='block';await load();render();}
boot();
</script></body></html>
